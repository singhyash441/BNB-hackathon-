                    placeholder="e.g. RED or BLUE"
                    className="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold"
                  />
                </div>

                <div className="w-52">
                  <label className="block text-[10px] text-slate-400 font-semibold mb-1 uppercase">Font / Ink Color</label>
                  <div className="flex items-center gap-1.5">
                    {COLOR_PALETTE.map(col => (
                      <button
                        key={col.hex}
                        type="button"
                        onClick={() => setTrials(p => p.map(t => t.id === trial.id ? { ...t, font_color: col.hex } : t))}
                        title={col.label}
                        className={`w-6 h-6 rounded-full border-2 transition-transform ${
                          trial.font_color === col.hex ? 'scale-125 border-slate-900 shadow-md' : 'border-slate-300'
                        }`}
                        style={{ backgroundColor: col.hex }}
                      />
                    ))}
                    <input
                      type="color"
                      value={trial.font_color || '#ffffff'}
                      onChange={(e) => {
                        const v = e.target.value;
                        setTrials(p => p.map(t => t.id === trial.id ? { ...t, font_color: v } : t));
                      }}
                      className="w-6 h-6 rounded cursor-pointer border-0 p-0 ml-1"
                    />
                  </div>
                </div>

                <div className="w-24">
                  <label className="block text-[10px] text-slate-400 font-semibold mb-1 uppercase">Target Key</label>
                  <input
                    type="text"
                    maxLength={5}
                    value={trial.targetKey}
                    onChange={(e) => {
                      const v = e.target.value;
                      setTrials(p => p.map(t => t.id === trial.id ? { ...t, targetKey: v } : t));
                    }}
                    placeholder="f or j"
                    className="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-mono text-center font-bold"
                  />
                </div>

                <button
                  onClick={() => trials.length > 1 && setTrials(p => p.filter(t => t.id !== trial.id))}
                  disabled={trials.length <= 1}
                  className="w-8 h-8 rounded-lg text-slate-400 hover:text-rose-600 disabled:opacity-20 flex items-center justify-center mt-4"
                >
                  ✕
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* PSYCHOLOGY BUILDER: Requirement 3 Clean Question & Local Image Bar */}
      {testType === 'psychology' && (
        <div className="bg-white rounded-2xl border border-slate-200 p-6">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h4 className="font-semibold text-slate-800 text-sm flex items-center gap-1.5">
                <Icon n="Clipboard" size={15} cls="text-violet-600" /> Assessment Questions & Local Image Files
              </h4>
              <p className="text-xs text-slate-400 mt-0.5">
                Type question prompts and upload images directly from your computer local drive
              </p>
            </div>
            <button
              onClick={() => setQuestions(p => [
                ...p,
                {
                  id: Date.now(),
                  question: '',
                  image_url: '',
                  options: [
                    'Option A description',
                    'Option B description',
                    'Option C description',
                    'Option D description'
                  ]
                }
              ])}
              className="btn-brand text-xs px-3.5 py-1.5 rounded-lg flex items-center gap-1"
            >
              + Add Question
            </button>
          </div>

          <div className="space-y-4">
            {questions.map((q, idx) => (
              <div key={q.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-3">
                <div className="flex items-start justify-between gap-3">
                  <span className="text-xs font-bold text-slate-400 font-mono mt-2">Q{idx + 1}</span>
                  <div className="flex-1">
                    <input
                      type="text"
                      value={q.question}
                      onChange={(e) => {
                        const v = e.target.value;
                        setQuestions(p => p.map(item => item.id === q.id ? { ...item, question: v } : item));
                      }}
                      placeholder="Type your question or statement..."
                      className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold"
                    />
                  </div>

                  {/* Local File Upload Button */}
                  <label className="cursor-pointer px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 border border-slate-200 bg-white hover:border-indigo-400 hover:text-indigo-600 transition-all text-slate-700 shadow-sm shrink-0">
                    <Icon n="Image" size={13} />
                    <span>{q.image_url ? 'Change File' : '+ Upload Image from PC'}</span>
                    <input
                      type="file"
                      accept="image/*"
                      className="hidden"
                      onChange={(e) => handleLocalImageUpload(q.id, e.target.files?.[0])}
                    />
                  </label>

                  <button
                    onClick={() => questions.length > 1 && setQuestions(p => p.filter(item => item.id !== q.id))}
                    disabled={questions.length <= 1}
                    className="w-8 h-8 rounded-lg text-slate-400 hover:text-rose-600 disabled:opacity-20 flex items-center justify-center shrink-0"
                  >
                    ✕
                  </button>
                </div>

                {/* Local Uploaded Image Preview Thumbnail with Click to Full Screen */}
                {q.image_url && (
                  <div className="flex items-center gap-3 bg-white p-2.5 rounded-xl border border-slate-200">
                    <div
                      onClick={() => setPreviewImage(q.image_url)}
                      className="group relative cursor-zoom-in overflow-hidden rounded-lg border border-slate-200 shrink-0"
                      title="Click to view full screen preview"
                    >
                      <img src={q.image_url} alt="Local stimulus" className="w-16 h-16 object-cover transition-transform group-hover:scale-105" />
                      <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                        <Icon n="Maximize" size={12} cls="text-white" />
                      </div>
                    </div>
                    <div className="flex-1 text-xs text-slate-600 font-medium">
                      <div>✓ Image attached from local computer files</div>

                        type="button"
                        onClick={() => setPreviewImage(q.image_url)}
                        className="text-[11px] text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1 mt-0.5"
                      >
                        <Icon n="Maximize" size={11} /> Click to preview full screen

                    </div>
                    <button
                      onClick={() => setQuestions(p => p.map(item => item.id === q.id ? { ...item, image_url: '' } : item))}

                      Remove

                  </div>

                {/* 4 Options Provided by Researcher */}
                <div className="pt-2 space-y-2 border-t border-slate-200/80">
                  <div className="flex items-center justify-between">
                    <label className="text-[11px] font-bold text-slate-700 uppercase tracking-wider">
                      4 Options Provided to Participant:
                    </label>
                    <span className="text-[10px] text-slate-400 font-medium">
                      Participants can pick 1 of these 4, or type their own in Option 5
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {['A', 'B', 'C', 'D'].map((letter, optIdx) => (

                        <input
                          type="text"
                          value={q.options?.[optIdx] || ''}
                          onChange={(e) => {
                            const val = e.target.value;
                            setQuestions(p => p.map(item => {

                                const newOpts = [...(item.options || ['', '', '', ''])];
                                newOpts[optIdx] = val;
                                return { ...item, options: newOpts };
                              }
                              return item;
                            }));
                          }}
                          placeholder={`Option ${letter} description...`}
                          className="w-full text-xs font-medium text-slate-800 placeholder-slate-400 outline-none bg-transparent"
                        />
                      </div>
                    ))}
                  </div>

                  {/* 5th Option Visual Notice */}
                  <div className="p-3 rounded-xl bg-gradient-to-r from-violet-50 to-indigo-50 border border-violet-100 flex items-center gap-3 text-xs text-slate-700">
                    <span className="w-6 h-6 rounded-lg bg-violet-600 text-white font-bold text-xs flex items-center justify-center shrink-0 shadow-sm">
                      E
                    </span>
                    <div className="flex-1">
                      <span className="font-bold text-violet-900">5th Option (Custom Typed Answer):</span>
                      <span className="text-slate-600 ml-1">
                        Automatically enabled. Participants can select this option to type any custom answer or reflection.
                      </span>
                    </div>
                    <span className="text-[10px] font-bold uppercase tracking-wider bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full border border-emerald-200 flex items-center gap-1 shrink-0">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" /> Auto Enabled
                    </span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Deploy Button */}
      <div className="bg-gradient-to-r from-indigo-50 to-violet-50 rounded-2xl border border-indigo-100 p-6 flex items-center justify-between">
        <div>
          <h4 className="font-semibold text-slate-800 text-sm">Deploy {testType === 'cognitive' ? 'Cognitive Protocol' : 'Psychology Assessment'}</h4>
          <p className="text-xs text-slate-500 mt-0.5">Available for participants with live telemetry</p>
        </div>
        <button
          onClick={handleDeploy}
          disabled={!title.trim() || deploying}
          className="btn-brand text-xs font-bold px-7 py-3 rounded-xl flex items-center gap-2 shadow-md"
        >
          {deploying ? 'Deploying...' : <><Icon n="Rocket" size={14} /> Deploy Protocol</>}
        </button>
      </div>

      {/* Big Screen Image Preview Modal for Researcher */}
      {previewImage && (
        <ImagePreviewModal
          src={previewImage}
          alt="Stimulus preview"
          onClose={() => setPreviewImage(null)}
        />
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────────
   RESEARCHER STATISTICS MODAL
───────────────────────────────────────────────────────────────────────────── */
function ExperimentAnalyticsModal({ exp, onClose }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    async function loadStats() {
      setLoading(true);
      const res = await db.fetchExperimentAnalytics(exp.id);
      setData(res);
      setLoading(false);
    }
    loadStats();
  }, [exp.id]);

  const downloadCSV = () => {
    if (!data || !data.logs) return;
    const headers = ['participant_name', 'stimulus', 'font_color', 'user_response', 'target_key', 'reaction_time_ms', 'is_correct', 'timestamp'];
    const rows = data.logs.map(r => [
      `"${r.participant_name}"`,
      `"${r.stimulus.replace(/"/g, '""')}"`,
      r.font_color || '#ffffff',
      `"${(r.user_response || '').replace(/"/g, '""')}"`,
      r.target_key,
      r.reaction_time_ms,
      r.is_correct ? 'TRUE' : 'FALSE',
      r.created_at || new Date().toISOString()
    ]);
    const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
    const link = document.createElement("a");
    link.setAttribute("href", encodeURI(csvContent));
    link.setAttribute("download", `${exp.title.toLowerCase().replace(/\s+/g, '_')}_dataset.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm anim-fade">
      <div className="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden anim-up flex flex-col max-h-[90vh]">
        <div className="bg-slate-900 p-6 text-white flex items-center justify-between">
          <div>
            <span className="text-[10px] font-mono uppercase text-indigo-400 tracking-wider">
              {exp.type === 'psychology' ? 'Psychological Psychometric Analysis' : 'Cognitive Latency Telemetry'}
            </span>
            <h2 className="text-xl font-bold mt-0.5">{exp.title}</h2>
          </div>
          <button onClick={onClose} className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-colors">✕</button>
        </div>

        <div className="p-6 space-y-6 overflow-y-auto flex-1">
          {loading ? (
            <div className="py-12 flex flex-col items-center justify-center text-slate-400 text-xs">
              <div className="w-8 h-8 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mb-3" />
              Aggregating participant behavioral cohort...
            </div>
          ) : (
            <>
              <div className="grid grid-cols-4 gap-3">
                <div className="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
                  <p className="text-[10px] font-semibold text-slate-400 uppercase">Subjects (N)</p>
                  <p className="text-xl font-bold text-slate-900 mt-1">{data.participants_count}</p>
                </div>
                <div className="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
                  <p className="text-[10px] font-semibold text-slate-400 uppercase">Mean Latency</p>
                  <p className="text-xl font-bold text-indigo-600 mt-1">{data.mean_rt_ms} ms</p>
                </div>
                <div className="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
                  <p className="text-[10px] font-semibold text-slate-400 uppercase">Accuracy / Validity</p>
                  <p className="text-xl font-bold text-emerald-600 mt-1">{data.accuracy_rate}%</p>
                </div>
                <div className="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
                  <p className="text-[10px] font-semibold text-slate-400 uppercase">Total Points</p>
                  <p className="text-xl font-bold text-slate-900 mt-1">{data.total_data_points}</p>
                </div>
              </div>

              <div>
                <div className="flex items-center justify-between mb-2.5">
                  <h4 className="text-xs font-bold text-slate-800 uppercase tracking-wider">
                    Participant Responses Stream (Full Name View)
                  </h4>
                  <button onClick={downloadCSV} className="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">
                    <Icon n="Download" size={12} /> Export CSV
                  </button>
                </div>

                <div className="border border-slate-200 rounded-2xl overflow-x-auto text-xs shadow-sm bg-white">
                  <table className="min-w-[840px] w-full text-left border-collapse">
                    <thead className="bg-slate-50 border-b border-slate-200 text-[10px] uppercase text-slate-400 font-semibold tracking-wider">
                      <tr>
                        <th className="px-4 py-3 min-w-[170px] whitespace-nowrap">Participant Full Name</th>
                        <th className="px-4 py-3 min-w-[200px] max-w-[280px]">Stimulus / Item</th>
                        <th className="px-4 py-3 min-w-[260px] max-w-[340px]">Participant Response</th>
                        <th className="px-4 py-3 min-w-[130px] whitespace-nowrap text-center">Reaction Time</th>
                        <th className="px-4 py-3 min-w-[110px] whitespace-nowrap text-center">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 text-[11px]">
                      {data.logs.map((log, i) => (
                        <tr key={i} className="hover:bg-slate-50/80 transition-colors">
                          <td className="px-4 py-3 font-bold text-slate-900 whitespace-nowrap align-middle">
                            {log.participant_name}
                          </td>
                          <td className="px-4 py-3 max-w-[280px] align-middle">
                            <div
                              className="font-medium text-slate-800 line-clamp-2 leading-relaxed"
                              style={{ color: (log.font_color && log.font_color !== '#ffffff') ? log.font_color : '#1e293b' }}
                              title={log.stimulus}
                            >
                              {log.stimulus}
                            </div>
                          </td>
                          <td className="px-4 py-3 max-w-[340px] align-middle">
                            <div
                              className="font-mono text-xs text-slate-700 bg-slate-50/90 border border-slate-200/80 px-2.5 py-1.5 rounded-lg line-clamp-2 hover:line-clamp-none transition-all cursor-pointer leading-relaxed"
                              title={log.user_response}
                            >
                              {log.user_response}
                            </div>
                          </td>
                          <td className="px-4 py-3 whitespace-nowrap text-center align-middle">
                            <span className="inline-flex items-center justify-center font-mono font-bold text-indigo-700 bg-indigo-50 border border-indigo-200/80 px-3 py-1 rounded-lg text-xs shadow-xs">
                              {log.reaction_time_ms} ms
                            </span>
                          </td>
                          <td className="px-4 py-3 whitespace-nowrap text-center align-middle">
                            {log.is_correct ? (
                              <span className="inline-flex items-center gap-1 bg-emerald-50 border border-emerald-200 text-emerald-700 px-2.5 py-1 rounded-lg text-[11px] font-semibold">
                                ✓ Recorded
                              </span>
                            ) : (
                              <span className="inline-flex items-center gap-1 bg-rose-50 border border-rose-200 text-rose-700 px-2.5 py-1 rounded-lg text-[11px] font-semibold">
                                ✕ Error
                              </span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          )}
        </div>

        <div className="p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between">
          <span className="text-xs text-slate-400">IRB Anonymized Participant Records</span>
          <button onClick={onClose} className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold transition-colors">
            Close
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────────
   MAIN APPLICATION SHELL
───────────────────────────────────────────────────────────────────────────── */
function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [view, setView] = useState('dashboard');
  const [experiments, setExperiments] = useState([]);
  const [selectedExpForParticipant, setSelectedExpForParticipant] = useState(null);
  const [selectedExpForAnalytics, setSelectedExpForAnalytics] = useState(null);
  const [activeSession, setActiveSession] = useState(null);

  const refreshExperiments = async () => {
    const data = await db.fetchExperiments();
    setExperiments(data || []);
  };

  useEffect(() => {
    refreshExperiments();
  }, []);

  const handleLoginSuccess = (user) => {
    setCurrentUser(user);
    setView('dashboard');
  };

  const handleLogout = () => {
    setCurrentUser(null);
    setActiveSession(null);
    setSelectedExpForParticipant(null);
  };

  const handleToggleStatus = async (expId) => {
    await db.toggleExperimentStatus(expId);
    refreshExperiments();
  };

  const handleDelete = async (expId, title) => {
    if (!confirm(`Are you sure you want to permanently delete the protocol "${title}"?`)) return;
    await db.deleteExperiment(expId);
    refreshExperiments();
  };

  if (!currentUser) {
    return <AuthPortal onLoginSuccess={handleLoginSuccess} />;
  }

  // Active Runner
  if (activeSession) {
    if (activeSession.exp.type === 'psychology') {
      return (
        <PsychologyRunner
          exp={activeSession.exp}
          participantId={activeSession.participantId}
          participantName={activeSession.participantName}
          onExit={() => setActiveSession(null)}
          onComplete={() => setActiveSession(null)}
        />
      );
    } else {
      return (
        <CognitiveRunner
          exp={activeSession.exp}
          participantId={activeSession.participantId}
          participantName={activeSession.participantName}
          onExit={() => setActiveSession(null)}
          onComplete={() => setActiveSession(null)}
        />
      );
    }
  }

  const isResearcher = currentUser.role === 'researcher';

  return (
    <div className="min-h-screen bg-slate-50">
      {/* Top Nav (NO SWITCHER BAR) */}
      <nav className="sticky top-0 z-40 glass border-b border-slate-200/80">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white font-black text-xs shadow-md shadow-indigo-200 select-none">
              CF
            </div>
            <span className="font-extrabold text-slate-900 text-lg tracking-tight">CogniForm</span>
            <span className="text-slate-300 hidden sm:inline ml-1">|</span>
            <span className="text-slate-500 text-xs hidden sm:inline font-medium">
              {isResearcher ? 'Researcher Workspace' : 'Participant Hub'}
            </span>
          </div>

          {/* User Profile & Log Out */}
          <div className="flex items-center gap-3">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-600 text-white flex items-center justify-center text-xs font-bold shadow-sm">
                {currentUser.name.charAt(0)}
              </div>
              <div className="hidden sm:block text-left">
                <div className="text-xs font-bold text-slate-800 leading-none">{currentUser.name}</div>
                <div className="text-[10px] text-slate-400 capitalize mt-0.5">
                  {isResearcher ? 'Principal Investigator' : 'Study Participant'}
                </div>
              </div>
            </div>
            <button
              onClick={handleLogout}
              className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors ml-2"
              title="Sign Out / Switch Account"
            >
              <Icon n="LogOut" size={15} />
            </button>
          </div>
        </div>
      </nav>

      {/* Main Content Area */}
      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        {isResearcher ? (
          view === 'create' ? (
            <ExperimentBuilder
              onDeploySuccess={() => {
                setView('dashboard');
                refreshExperiments();
              }}
              onBack={() => setView('dashboard')}
            />
          ) : (
            <div className="anim-fade space-y-6">
              {/* Researcher Banner */}
              <div className="rounded-3xl bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 p-8 text-white flex flex-col md:flex-row items-start md:items-center justify-between gap-6 shadow-xl">
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider text-indigo-200 mb-1 block">
                    Investigator Workspace
                  </span>
                  <h2 className="text-3xl font-bold">Welcome back, {currentUser.name}</h2>
                  <p className="text-indigo-200 text-sm mt-1">
                    Manage active protocols, pause/resume data collection, or analyze participant cohorts.
                  </p>
                </div>
                <button
                  onClick={() => setView('create')}
                  className="bg-white text-indigo-700 hover:bg-indigo-50 font-bold text-xs px-5 py-3 rounded-xl shadow-lg transition-all"
                >
                  + Create New Experiment
                </button>
              </div>

              {/* Experiments Table */}
              <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                  <h3 className="font-bold text-slate-900 text-sm">Active Research Protocols</h3>
                  <span className="text-xs text-slate-400">{experiments.length} total protocols</span>
                </div>
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 border-b border-slate-100 text-[10px] uppercase font-semibold text-slate-400">
                    <tr>
                      <th className="px-6 py-3.5">Protocol Title & Paradigm</th>
                      <th className="px-6 py-3.5">Status</th>
                      <th className="px-6 py-3.5">Time Limit</th>
                      <th className="px-6 py-3.5">Sample (N)</th>
                      <th className="px-6 py-3.5 text-right">Protocol Controls</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {experiments.map((e) => (
                      <tr key={e.id} className="hover:bg-slate-50">
                        <td className="px-6 py-4">
                          <div className="flex items-center gap-3">
                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-white ${
                              e.type === 'psychology' ? 'bg-violet-600' : 'bg-indigo-600'
                            }`}>
                              <Icon n={e.type === 'psychology' ? 'Clipboard' : 'Brain'} size={14} />
                            </div>
                            <div>
                              <div className="font-bold text-slate-900 text-sm">{e.title}</div>
                              <span className="text-[10px] font-mono text-slate-400 uppercase tracking-wider">
                                {e.type === 'psychology' ? 'Psychological Assessment' : 'Cognitive Protocol'}
                              </span>
                            </div>
                          </div>
                        </td>
                        <td className="px-6 py-4">
                          <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold border ${
                            e.status === 'live'
                              ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                              : 'bg-amber-50 text-amber-700 border-amber-200'
                          }`}>
                            {e.status === 'live' ? '● Live' : '⏸ Stopped'}
                          </span>
                        </td>
                        <td className="px-6 py-4 font-mono font-semibold text-slate-600">
                          {e.type === 'cognitive' ? `${e.time_limit_seconds || 20}s limit` : 'Self-paced'}
                        </td>
                        <td className="px-6 py-4 font-mono font-semibold">{e.participants_count || 142} subjects</td>
                        <td className="px-6 py-4 text-right">
                          <div className="flex items-center justify-end gap-2">
                            {/* Stop/Resume Toggle */}
                            <button
                              onClick={() => handleToggleStatus(e.id)}
                              className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition-all ${
                                e.status === 'live'
                                  ? 'bg-amber-50 hover:bg-amber-100 text-amber-800'
                                  : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700'
                              }`}
                              title={e.status === 'live' ? 'Stop participants from taking test' : 'Resume participant testing'}
                            >
                              <Icon n={e.status === 'live' ? 'Pause' : 'Play'} size={11} />
                              {e.status === 'live' ? 'Stop Test' : 'Resume'}
                            </button>

                            {/* View Statistics */}
                            <button
                              onClick={() => setSelectedExpForAnalytics(e)}
                              className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-lg text-xs"
                            >
                              📊 Statistics
                            </button>

                            {/* Delete Protocol */}
                            <button
                              onClick={() => handleDelete(e.id, e.title)}
                              className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-colors"
                              title="Delete experiment permanently"
                            >
                              <Icon n="Trash" size={13} />
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )
        ) : (
          /* Participant Mode */
          <div className="anim-fade space-y-6">
            <div>
              <h2 className="text-2xl font-bold text-slate-900">CogniForm Research Hub</h2>
              <p className="text-slate-500 text-sm mt-1">
                Welcome, {currentUser.name}. Select an open protocol to participate and contribute research data.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {experiments.map((exp) => (
                <div key={exp.id} className="bg-white rounded-2xl border border-slate-200 p-6 flex flex-col justify-between card-lift">
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${
                        exp.type === 'psychology'
                          ? 'bg-violet-100 text-violet-700'
                          : 'bg-indigo-100 text-indigo-700'
                      }`}>
                        {exp.type === 'psychology' ? 'Psychology Assessment' : `Cognitive (${exp.time_limit_seconds || 20}s)`}
                      </span>
                      {exp.status === 'stopped' && (
                        <span className="text-[10px] font-bold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full">
                          ⏸ Enrollment Paused
                        </span>
                      )}
                    </div>
                    <h3 className="font-bold text-slate-900 text-base mt-1">{exp.title}</h3>
                    <p className="text-xs text-slate-500 mt-2 leading-relaxed line-clamp-3">
                      {exp.description}
                    </p>
                  </div>

                  <button
                    onClick={() => setSelectedExpForParticipant(exp)}
                    disabled={exp.status === 'stopped'}
                    className={`mt-6 w-full py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all ${
                      exp.status === 'stopped'
                        ? 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                        : 'btn-brand shadow-md shadow-indigo-100'
                    }`}
                  >
                    {exp.status === 'stopped' ? (
                      '✕ Test Closed by Researcher'
                    ) : (
                      <><Icon n="Play" size={12} /> Participate Now</>
                    )}
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}
      </main>

      {/* Participant Flow Modal */}
      {selectedExpForParticipant && (
        <ParticipantFlowModal
          exp={selectedExpForParticipant}
          defaultName={currentUser.name}
          onClose={() => setSelectedExpForParticipant(null)}
          onLaunch={(participantId, participantName) => {
            const exp = selectedExpForParticipant;
            setSelectedExpForParticipant(null);
            setActiveSession({ exp, participantId, participantName });
          }}
        />
      )}

      {/* Researcher Statistics Modal */}
      {selectedExpForAnalytics && (
        <ExperimentAnalyticsModal
          exp={selectedExpForAnalytics}
          onClose={() => setSelectedExpForAnalytics(null)}
        />
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────────
   GLOBAL ERROR BOUNDARY (Guarantees app never fails to a blank white screen)
───────────────────────────────────────────────────────────────────────────── */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("ErrorBoundary caught an unhandled error:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6">
          <div className="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl text-center space-y-4">
            <div className="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto text-xl font-bold">
              ⚠️
            </div>
            <div>
              <h2 className="text-lg font-bold text-white">Temporary Interface Error</h2>
              <p className="text-xs text-slate-400 mt-1">An unexpected error occurred during rendering. You can resume safely.</p>
            </div>
            <div className="text-[11px] text-slate-300 font-mono bg-slate-950 p-3 rounded-xl text-left overflow-x-auto max-h-28 border border-slate-800">
              {this.state.error?.message || String(this.state.error)}
            </div>
            <button
              onClick={() => {
                this.setState({ hasError: false, error: null });
                window.location.reload();
              }}
              className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-lg shadow-indigo-600/30 transition-all"
            >
              Reload Application
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
</body>
