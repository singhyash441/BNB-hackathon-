<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CogniForm — Cognitive & Psychological Science Platform</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel JSX Transpiler -->
  <script src="https://unpkg.com/@babel/standalone@7.23.4/babel.min.js"></script>

  <!-- Supabase JS Client v2 -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- jsPsych v7 Core & Plugins -->
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" />
  <script src="https://unpkg.com/jspsych@7.3.4/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@1.1.3/dist/index.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #0f172a; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 99px; }

    .glass { background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

    /* Animations */
    @keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
    @keyframes slideUp { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:translateY(0) } }
    @keyframes toastIn { from { opacity:0; transform:translateX(110%) } to { opacity:1; transform:translateX(0) } }
    @keyframes pulseGlow { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:0.75; transform:scale(1.04)} }

    .anim-fade  { animation: fadeIn 0.3s ease both; }
    .anim-up    { animation: slideUp 0.35s cubic-bezier(0.22,1,0.36,1) both; }
    .anim-toast { animation: toastIn 0.35s cubic-bezier(0.22,1,0.36,1) both; }
    .pulse-glow { animation: pulseGlow 1.5s ease infinite; }

    /* jsPsych Target Custom Styling */
    #jspsych-target {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    #jspsych-target .jspsych-content-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #jspsych-target .jspsych-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .btn-brand {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white; font-weight: 600; transition: all .18s ease;
    }
    .btn-brand:hover:not(:disabled) {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      box-shadow: 0 8px 22px rgba(99,102,241,.38);
      transform: translateY(-1px);
    }
    .btn-brand:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
    .btn-brand:disabled { opacity: .45; cursor: not-allowed; }

    .card-lift { transition: transform .18s ease, box-shadow .18s ease; }
    .card-lift:hover { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(99,102,241,.12); }

    input, select, textarea {
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ─────────────────────────────────────────────────────────────────────────────
   DATABASE & STORAGE LAYER
───────────────────────────────────────────────────────────────────────────── */
const DEFAULT_SUPABASE_URL = window.NEXT_PUBLIC_SUPABASE_URL || localStorage.getItem('cogniform_sb_url') || '';
const DEFAULT_SUPABASE_KEY = window.NEXT_PUBLIC_SUPABASE_ANON_KEY || localStorage.getItem('cogniform_sb_key') || '';

let realSupabase = null;
if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_KEY && window.supabase) {
  try {
    realSupabase = window.supabase.createClient(DEFAULT_SUPABASE_URL, DEFAULT_SUPABASE_KEY);
  } catch (e) {
    console.warn('Could not initialize Supabase client:', e);
  }
}

const LocalMockDB = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem(`cogniform_${key}`);
      return v ? JSON.parse(v) : fallback;
    } catch(e) { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem(`cogniform_${key}`, JSON.stringify(val)); } catch(e) {}
  }
};

// Requirement 2 Fix: Initial Stroop color definitions
const STROOP_DEFAULT_TRIALS = [
  { id: 'tr-1', experiment_id: 'exp-stroop-1', stimulus: 'RED', font_color: '#3b82f6', target_key: 'j', order_index: 0 },
  { id: 'tr-2', experiment_id: 'exp-stroop-1', stimulus: 'BLUE', font_color: '#ef4444', target_key: 'f', order_index: 1 },
  { id: 'tr-3', experiment_id: 'exp-stroop-1', stimulus: 'GREEN', font_color: '#eab308', target_key: 'j', order_index: 2 },
  { id: 'tr-4', experiment_id: 'exp-stroop-1', stimulus: 'YELLOW', font_color: '#10b981', target_key: 'f', order_index: 3 },
  { id: 'tr-5', experiment_id: 'exp-stroop-1', stimulus: 'PURPLE', font_color: '#ef4444', target_key: 'f', order_index: 4 },
  { id: 'tr-6', experiment_id: 'exp-stroop-1', stimulus: 'ORANGE', font_color: '#3b82f6', target_key: 'j', order_index: 5 },
];

// Seed or force-update Stroop trials so ink colors are GUARANTEED present
let existingTrials = LocalMockDB.get('trials', null);
if (!existingTrials || existingTrials.length === 0 || !existingTrials.some(t => t.experiment_id === 'exp-stroop-1' && t.font_color)) {
  LocalMockDB.set('trials', STROOP_DEFAULT_TRIALS);
} else {
  // Ensure existing Stroop trials have font_color updated
  const updated = existingTrials.map(t => {
    if (t.experiment_id === 'exp-stroop-1' && (!t.font_color || t.font_color === '#ffffff')) {
      const match = STROOP_DEFAULT_TRIALS.find(s => s.id === t.id);
      return { ...t, font_color: match ? match.font_color : '#ef4444' };
    }
    return t;
  });
  LocalMockDB.set('trials', updated);
}

// Requirement: Default psychology questions with 4 researcher-provided options
const PSY_DEFAULT_QUESTIONS = [
  {
    id: 'pq-1',
    experiment_id: 'exp-psy-2',
    question: 'How does this high-pressure collaborative environment affect your psychological state and focus?',
    image_url: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80',
    options: [
      'Energized and hyper-focused on solving the problem together',
      'Moderately anxious but capable of maintaining task structure',
      'Overwhelmed by multiple parallel discussions and noise',
      'Emotionally calm and preferring to analyze data individually'
    ]
  },
  {
    id: 'pq-2',
    experiment_id: 'exp-psy-2',
    question: 'When encountering unexpected technical roadblocks like in this scenario, what is your immediate cognitive response?',
    image_url: 'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1200&q=80',
    options: [
      'Break the obstacle down into micro-hypotheses and test systematically',
      'Seek consultation immediately from peers or subject experts',
      'Pause and step away briefly to prevent cognitive tunneling',
      'Experience frustration and fatigue before regrouping'
    ]
  },
  {
    id: 'pq-3',
    experiment_id: 'exp-psy-2',
    question: 'Reflecting on complex cognitive challenges, which factor best sustains your intrinsic motivation?',
    image_url: 'https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=80',
    options: [
      'Intellectual curiosity and mastering unfamiliar paradigms',
      'Clear milestones, external recognition, and deadlines',
      'Autonomy and freedom to choose my own problem-solving approach',
      'Social responsibility and creating positive team outcomes'
    ]
  }
];

// Seed or force-update psy_questions to guarantee 4 options are present in localStorage
let existingPsy = LocalMockDB.get('psy_questions', []);
if (!existingPsy || !Array.isArray(existingPsy) || existingPsy.length === 0) {
  LocalMockDB.set('psy_questions', PSY_DEFAULT_QUESTIONS);
} else {
  // Ensure PSY_DEFAULT_QUESTIONS are present for exp-psy-2
  let merged = [...existingPsy];
  PSY_DEFAULT_QUESTIONS.forEach(defQ => {
    const idx = merged.findIndex(q => q.id === defQ.id || (q.experiment_id === defQ.experiment_id && q.question === defQ.question));
    if (idx >= 0) {
      merged[idx] = { ...merged[idx], options: defQ.options };
    } else {
      merged.push(defQ);
    }
  });

  // Ensure any custom question has at least 4 options
  const updatedPsy = merged.map(q => {
    if (!q.options || !Array.isArray(q.options) || q.options.length < 4) {
      return {
        ...q,
        options: [
          'Strongly agree with this operational approach',
          'Tend to favor moderate compromise and discussion',
          'Prefer alternative methodologies with higher certainty',
          'Neutral or depends heavily on situational context'
        ]
      };
    }
    return q;
  });
  LocalMockDB.set('psy_questions', updatedPsy);
}

if (!LocalMockDB.get('experiments', null)) {
  LocalMockDB.set('experiments', [
    {
      id: 'exp-stroop-1',
      type: 'cognitive',
      title: 'The Stroop Interference Task',
      description: 'Measures executive inhibitory control when ink color conflicts with semantic word meaning.',
      time_limit_seconds: 20,
      rules: '1. Place your left index finger on [F] and right index finger on [J].\n2. A central fixation cross (+) will appear for 500ms before each item.\n3. Identify the INK/FONT COLOR of the word, NOT the written word itself!\n4. Complete as many randomized items as possible within the 20-second time limit.',
      status: 'live',
      participants_count: 142,
      mean_rt_ms: 486,
      accuracy_rate: 94.2,
      created_at: new Date('2026-09-18').toISOString()
    },
    {
      id: 'exp-psy-2',
      type: 'psychology',
      title: 'Emotional Valence & Open Reflection Assessment',
      description: 'Psychometric scale assessing affective visual processing and open-ended self-reported reflection.',
      time_limit_seconds: 0,
      rules: '1. Review each emotional image and question prompt carefully.\n2. You can click on any stimulus image to expand it in full screen.\n3. Choose from 4 researcher options or type any custom answer in Option 5.\n4. Take your time on each item.',
      status: 'live',
      participants_count: 98,
      mean_rt_ms: 0,
      accuracy_rate: 100,
      created_at: new Date('2026-09-22').toISOString()
    }
  ]);

  LocalMockDB.set('participants', [
    { id: 'p-1', name: 'Sarah Jenkins', age: 24, gender: 'Female', education: "Master's Degree" },
    { id: 'p-2', name: 'David Chen', age: 29, gender: 'Male', education: "Bachelor's Degree" },
    { id: 'p-3', name: 'Elena Rostova', age: 31, gender: 'Female', education: "Doctoral Degree" },
    { id: 'p-4', name: 'Marcus Brody', age: 22, gender: 'Male', education: "Some College" }
  ]);

  LocalMockDB.set('results', []);
}

// Purge cognitive rules from any psychology experiment stored in localStorage
(function sanitizePsychologyRules() {
  const storedExperiments = LocalMockDB.get('experiments', []);
  if (Array.isArray(storedExperiments) && storedExperiments.length > 0) {
    let changed = false;
    const updatedExps = storedExperiments.map(e => {
      if (e.type === 'psychology') {
        const hasCognitiveRules = !e.rules || (
          e.rules.toLowerCase().includes('fixation cross') ||
          e.rules.toLowerCase().includes('ink color') ||
          e.rules.toLowerCase().includes('font color') ||
          e.rules.toLowerCase().includes('[f]') ||
          e.rules.toLowerCase().includes('[j]') ||
          e.rules.toLowerCase().includes('stroop')
        );
        if (hasCognitiveRules) {
          changed = true;
          return {
            ...e,
            rules: '1. Review each visual stimulus image and question prompt carefully.\n2. You can click on any stimulus image to open a full-screen preview.\n3. Choose from the 4 provided options, or choose Option 5 to type your own reflection.\n4. Take as much time as you need—there is no countdown pressure.'
          };
        }
      }
      return e;
    });
    if (changed) {
      LocalMockDB.set('experiments', updatedExps);
    }
  }
})();

const db = {
  async insertExperiment(expData) {
    if (realSupabase) {
      const { data, error } = await realSupabase.from('experiments').insert([expData]).select().single();
      if (error) throw error;
      return data;
    }
    const exps = LocalMockDB.get('experiments', []);
    const newExp = {
      id: 'exp-' + Math.random().toString(36).substring(2, 9),
      ...expData,
      participants_count: 0,
      mean_rt_ms: 0,
      accuracy_rate: 0,
      created_at: new Date().toISOString()
    };
    exps.unshift(newExp);
    LocalMockDB.set('experiments', exps);
    return newExp;
  },

  async toggleExperimentStatus(id) {
    const exps = LocalMockDB.get('experiments', []);
    const exp = exps.find(e => e.id === id);
    if (!exp) return;
    const newStatus = exp.status === 'live' ? 'stopped' : 'live';
    exp.status = newStatus;
    LocalMockDB.set('experiments', exps);

    if (realSupabase) {
      try {
        await realSupabase.from('experiments').update({ status: newStatus }).eq('id', id);
      } catch(e) {}
    }
    return newStatus;
  },

  async deleteExperiment(id) {
    let exps = LocalMockDB.get('experiments', []);
    exps = exps.filter(e => e.id !== id);
    LocalMockDB.set('experiments', exps);

    let trials = LocalMockDB.get('trials', []);
    trials = trials.filter(t => t.experiment_id !== id);
    LocalMockDB.set('trials', trials);

    let psy = LocalMockDB.get('psy_questions', []);
    psy = psy.filter(q => q.experiment_id !== id);
    LocalMockDB.set('psy_questions', psy);

    if (realSupabase) {
      try {
        await realSupabase.from('experiments').delete().eq('id', id);
      } catch(e) {}
    }
  },

  async bulkInsertTrials(trialsPayload) {
    if (realSupabase) {
      const { error } = await realSupabase.from('trials').insert(trialsPayload);
      if (error) throw error;
      return;
    }
    const current = LocalMockDB.get('trials', []);
    const added = trialsPayload.map((t, idx) => ({
      id: 'tr-' + Math.random().toString(36).substring(2, 9),
      ...t,
      order_index: idx
    }));
    LocalMockDB.set('trials', [...current, ...added]);
  },

  async bulkInsertPsyQuestions(questionsPayload) {
    if (realSupabase) {
      try {
        await realSupabase.from('psy_questions').insert(questionsPayload);
      } catch(e) {
        console.warn('Supabase psy_questions insert error, using local fallback:', e);
      }
    }
    const current = LocalMockDB.get('psy_questions', []);
    const added = questionsPayload.map((q, idx) => ({
      id: q.id || 'pq-' + Math.random().toString(36).substring(2, 9),
      ...q,
      order_index: idx
    }));
    LocalMockDB.set('psy_questions', [...current, ...added]);
  },

  async insertParticipant(partData) {
    if (realSupabase) {
      const { data, error } = await realSupabase.from('participants').insert([{
        ...partData,
        consented_at: new Date().toISOString()
      }]).select().single();
      if (error) throw error;
      return data;
    }
    const parts = LocalMockDB.get('participants', []);
    const newPart = {
      id: 'part-' + Math.random().toString(36).substring(2, 9),
      ...partData,
      consented_at: new Date().toISOString()
    };
    parts.push(newPart);
    LocalMockDB.set('participants', parts);
    return newPart;
  },

  async fetchTrials(experimentId) {
    if (realSupabase) {
      const { data, error } = await realSupabase.from('trials').select('*').eq('experiment_id', experimentId).order('order_index', { ascending: true });
      if (error) throw error;
      return data;
    }
    return LocalMockDB.get('trials', []).filter(t => t.experiment_id === experimentId);
  },

  async fetchPsyQuestions(experimentId) {
    if (realSupabase) {
      try {
        const { data, error } = await realSupabase.from('psy_questions').select('*').eq('experiment_id', experimentId).order('order_index', { ascending: true });
        if (!error && data && data.length > 0) return data;
      } catch(e) {}
    }
    const local = LocalMockDB.get('psy_questions', []).filter(q => q.experiment_id === experimentId);
    if (local && local.length > 0) return local;
    // Guaranteed fallback: return default questions mapped to this experimentId
    return PSY_DEFAULT_QUESTIONS.map((q, i) => ({
      ...q,
      id: `gen-${experimentId}-${i}`,
      experiment_id: experimentId
    }));
  },

  async bulkInsertResults(resultsPayload) {
    if (realSupabase) {
      const { error } = await realSupabase.from('results').insert(resultsPayload);
      if (error) throw error;
      return;
    }
    const current = LocalMockDB.get('results', []);
    const added = resultsPayload.map(r => ({
      id: 'res-' + Math.random().toString(36).substring(2, 9),
      created_at: new Date().toISOString(),
      ...r
    }));
    LocalMockDB.set('results', [...current, ...added]);
  },

  async fetchExperiments() {
    if (realSupabase) {
      const { data } = await realSupabase.from('experiments').select('*').order('created_at', { ascending: false });
      if (data) return data;
    }
    return LocalMockDB.get('experiments', []);
  },

  async fetchExperimentAnalytics(experimentId) {
    const trials = await this.fetchTrials(experimentId);
    const questions = await this.fetchPsyQuestions(experimentId);
    const allResults = LocalMockDB.get('results', []);
    const allParticipants = LocalMockDB.get('participants', []);
    const partMap = Object.fromEntries(allParticipants.map(p => [p.id, p.name || 'Anonymous User']));

    const matched = allResults.filter(r => r.experiment_id === experimentId || (trials.some(t => t.id === r.trial_id)));

    if (matched.length === 0) {
      const sampleNames = ['Sarah Jenkins', 'David Chen', 'Elena Rostova', 'Marcus Brody', 'Aisha Khan'];
      const demoLogs = sampleNames.flatMap((pName, pIdx) => {
        if (trials.length > 0) {
          return trials.map(tr => ({
            id: 'demo-' + Math.random().toString(36).substring(2, 7),
            participant_name: pName,
            stimulus: tr.stimulus,
            font_color: tr.font_color || '#3b82f6',
            user_response: tr.target_key,
            target_key: tr.target_key,
            reaction_time_ms: Math.round(420 + (Math.random() * 120 - 60)),
            is_correct: Math.random() > 0.08,
            created_at: new Date(Date.now() - pIdx * 7200000).toISOString()
          }));
        } else {
          return (questions.length > 0 ? questions : [{ id: 'q1', question: 'Affective Self-Report Reflection' }]).map(q => ({
            id: 'demo-' + Math.random().toString(36).substring(2, 7),
            participant_name: pName,
            stimulus: q.question,
            font_color: '#4f46e5',
            user_response: 'I prioritized strategic tasks and took short breathing breaks to sustain executive attention.',
            target_key: 'Typed Answer',
            reaction_time_ms: Math.round(2400 + Math.random() * 800),
            is_correct: true,
            created_at: new Date(Date.now() - pIdx * 7200000).toISOString()
          }));
        }
      });

      const totalCount = demoLogs.length;
      const correctCount = demoLogs.filter(r => r.is_correct).length;
      const meanRt = Math.round(demoLogs.reduce((acc, r) => acc + (r.reaction_time_ms || 0), 0) / totalCount);

      return {
        participants_count: sampleNames.length,
        mean_rt_ms: meanRt,
        accuracy_rate: ((correctCount / totalCount) * 100).toFixed(1),
        total_data_points: totalCount,
        logs: demoLogs
      };
    }

    const mapped = matched.map(r => ({
      ...r,
      participant_name: r.participant_name || partMap[r.participant_id] || 'Participant ' + r.participant_id.substring(0, 5)
    }));

    return {
      participants_count: new Set(mapped.map(m => m.participant_name)).size,
      mean_rt_ms: Math.round(mapped.reduce((acc, r) => acc + (r.reaction_time_ms || 0), 0) / (mapped.length || 1)),
      accuracy_rate: ((mapped.filter(r => r.is_correct).length / (mapped.length || 1)) * 100).toFixed(1),
      total_data_points: mapped.length,
      logs: mapped
    };
  }
};

/* ─────────────────────────────────────────────────────────────────────────────
   COGNITIVE JSPSYCH RUNNER (Requirement 1 & 2: Fixed Timer Stop & Colors)
───────────────────────────────────────────────────────────────────────────── */
function CognitiveRunner({ exp, participantName, participantId, onExit, onComplete }) {
  const experimentRef = useRef(null);
  const [loading, setLoading] = useState(true);
  const timeLimit = exp.time_limit_seconds || 20;
  const [timeLeft, setTimeLeft] = useState(timeLimit);
  const [isTimeUp, setIsTimeUp] = useState(false); // Requirement 1: Instant stop state
  const timerRef = useRef(null);
  const jsPsychRef = useRef(null);

  const shuffleArray = (array) => {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  // Requirement 1: Instant clean shutdown when timer expires
  const handleTimeExpired = async () => {
    if (timerRef.current) clearInterval(timerRef.current);
    
    // Blank out the jsPsych DOM immediately so words never linger!
    if (experimentRef.current) {
      experimentRef.current.innerHTML = '';
    }

    if (jsPsychRef.current) {
      try { jsPsychRef.current.abortExperiment(); } catch(e) {}
    }

    setIsTimeUp(true); // Switch view to completion modal

    // Save all trials collected so far
    try {
      const allData = jsPsychRef.current ? jsPsychRef.current.data.get().filter({ task: 'stimulus' }).values() : [];
      if (allData.length > 0) {
        const resultsPayload = allData.map(d => ({
          experiment_id: exp.id,
          participant_id: participantId,
          participant_name: participantName,
          stimulus: d.stimulus_text,
          font_color: d.font_color,
          reaction_time_ms: Math.round(d.rt || 0),
          user_response: d.response,
          target_key: d.target_key,
          is_correct: Boolean(d.is_correct)
        }));
        await db.bulkInsertResults(resultsPayload);
      }
    } catch(err) {
      console.error('Error saving data upon timeout:', err);
    }
  };

  useEffect(() => {
    let isMounted = true;

    async function run() {
      const baseTrials = await db.fetchTrials(exp.id);
      if (!isMounted || !experimentRef.current) return;
      if (!baseTrials || baseTrials.length === 0) {
        alert('No trials configured for this experiment.');
        onExit();
        return;
      }

      // Requirement 2: Fallback contrasting color palette to ensure Stroop always has colors
      const fallbackColors = ['#3b82f6', '#ef4444', '#10b981', '#eab308', '#a855f7'];

      // Continuous randomized stream
      const randomizedTrials = [];
      for (let rep = 0; rep < 25; rep++) {
        randomizedTrials.push(...shuffleArray(baseTrials));
      }

      const initFn = window.initJsPsych;
      const jsPsych = initFn({
        display_element: experimentRef.current,
        on_finish: async () => {
          if (timerRef.current) clearInterval(timerRef.current);
          const stimulusData = jsPsych.data.get().filter({ task: 'stimulus' }).values();
          const resultsPayload = stimulusData.map(d => ({
            experiment_id: exp.id,
            participant_id: participantId,
            participant_name: participantName,
            stimulus: d.stimulus_text,
            font_color: d.font_color,
            reaction_time_ms: Math.round(d.rt || 0),
            user_response: d.response,
            target_key: d.target_key,
            is_correct: Boolean(d.is_correct)
          }));
          if (resultsPayload.length > 0) {
            await db.bulkInsertResults(resultsPayload);
          }
          onComplete();
        }
      });
      jsPsychRef.current = jsPsych;

      const timeline = [];

      // Ready screen
      timeline.push({
        type: window.jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="color: white; text-align: center; font-family: Inter, sans-serif;">
            <div style="display: inline-block; padding: 6px 16px; background: rgba(99,102,241,0.25); border: 1px solid #6366f1; border-radius: 9999px; color: #a5b4fc; font-size: 13px; font-weight: 700; margin-bottom: 16px;">
              ⏱️ TIMED TEST: ${timeLimit} SECONDS
            </div>
            <h1 style="font-size: 32px; font-weight: 700; margin-bottom: 12px;">Get Ready, ${participantName}</h1>
            <p style="font-size: 15px; color: #94a3b8; max-width: 480px; line-height: 1.6; margin-bottom: 28px;">
              Identify the <strong style="color: #60a5fa;">INK COLOR</strong> of each word. Respond as rapidly as possible before the timer runs out!
            </p>
            <div style="display: inline-block; padding: 10px 24px; background: #4f46e5; border-radius: 12px; color: #ffffff; font-size: 14px; font-weight: 700;">
              Press ANY KEY to Start Timer
            </div>
          </div>
        `,
        choices: "ALL_KEYS",
        on_finish: () => {
          if (timeLimit > 0) {
            timerRef.current = setInterval(() => {
              setTimeLeft(prev => {
                if (prev <= 1) {
                  clearInterval(timerRef.current);
                  handleTimeExpired(); // Stop test immediately!
                  return 0;
                }
                return prev - 1;
              });
            }, 1000);
          }
        }
      });

      // Randomized trials with explicit ink font colors
      randomizedTrials.forEach((trial, idx) => {
        timeline.push({
          type: window.jsPsychHtmlKeyboardResponse,
          stimulus: '<div style="font-size: 96px; color: #ffffff; font-weight: 200; line-height: 1; user-select: none;">+</div>',
          choices: "NO_KEYS",
          trial_duration: 500,
          data: { task: 'fixation' }
        });

        // Requirement 2: Guarantee vibrant ink font color for Stroop test
        const fontColor = trial.font_color && trial.font_color !== '#ffffff'
          ? trial.font_color
          : fallbackColors[idx % fallbackColors.length];

        const targetKey = (trial.target_key || 'f').toLowerCase();

        timeline.push({
          type: window.jsPsychHtmlKeyboardResponse,
          stimulus: `
            <div style="text-align: center; user-select: none;">
              <div style="font-size: 76px; font-weight: 900; color: ${fontColor}; letter-spacing: 0.05em; text-shadow: 0 0 40px ${fontColor}88;">
                ${trial.stimulus}
              </div>
            </div>
          `,
          choices: ['f', 'j', 'space', targetKey],
          data: {
            task: 'stimulus',
            trial_id: trial.id,
            stimulus_text: trial.stimulus,
            font_color: fontColor,
            target_key: targetKey
          },
          on_finish: function(data) {
            const userKey = data.response ? data.response.toLowerCase() : null;
            data.is_correct = userKey === targetKey;
          }
        });
      });

      setLoading(false);
      await jsPsych.run(timeline);
    }

    run();

    const handleKeyDown = (e) => {
      if (e.key === 'Escape') {
        if (timerRef.current) clearInterval(timerRef.current);
        onExit();
      }
    };
    window.addEventListener('keydown', handleKeyDown);

    return () => {
      isMounted = false;
      if (timerRef.current) clearInterval(timerRef.current);
      window.removeEventListener('keydown', handleKeyDown);
    };
  }, [exp.id, participantId]);

  // Requirement 1: If time runs out, immediately render completion screen without showing words
  if (isTimeUp) {
    return (
      <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center text-white p-6 anim-fade">
        <div className="text-5xl mb-4">⏱️ ✨</div>
        <h2 className="text-3xl font-extrabold mb-2 text-white">Time's Up! Test Completed</h2>
        <p className="text-slate-400 text-sm max-w-md text-center mb-8 leading-relaxed">
          The {timeLimit}-second session has concluded. Your reaction times, latency distributions, and accuracy data have been recorded.
        </p>
        <button
          onClick={onComplete}
          className="btn-brand px-8 py-3.5 rounded-xl font-bold text-sm shadow-xl shadow-indigo-500/30"
        >
          Return to Dashboard →
        </button>
      </div>
    );
  }

  return (
    <div className="relative w-full h-screen bg-black overflow-hidden flex items-center justify-center">
      {timeLimit > 0 && !loading && (
        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 border border-slate-700 px-6 py-2.5 rounded-full text-white flex items-center gap-3 shadow-2xl backdrop-blur-md">
          <Icon n="Clock" size={16} cls={timeLeft <= 5 ? "text-rose-500 pulse-glow" : "text-indigo-400"} />
          <span className={`font-mono text-sm font-bold tracking-wider ${timeLeft <= 5 ? "text-rose-400 font-extrabold" : "text-white"}`}>
            TIME LEFT: {timeLeft}s
          </span>
        </div>
      )}

      <div id="jspsych-target" ref={experimentRef} className="w-full h-screen bg-black" />

      {loading && (
        <div className="absolute inset-0 flex flex-col items-center justify-center bg-black text-white z-20">
          <div className="w-10 h-10 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4" />
          <p className="text-sm font-mono text-slate-400">Loading trial stimuli & ink palettes...</p>
        </div>
      )}

      <button
        onClick={() => {
          if (timerRef.current) clearInterval(timerRef.current);
          onExit();
        }}
        className="fixed bottom-6 right-6 z-40 flex items-center gap-2 text-slate-500 hover:text-white border border-slate-800 bg-black/80 px-3.5 py-1.5 rounded-lg text-xs"
      >
        <kbd className="font-mono text-[10px] bg-slate-800 border border-slate-700 rounded px-1 text-slate-400">ESC</kbd>
        Exit Test
      </button>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────────
   PSYCHOLOGY ASSESSMENT RUNNER (5 Options: 4 Researcher + 5th Custom Typed Answer,
   plus Full-Screen Image Preview on Hover & Click)
───────────────────────────────────────────────────────────────────────────── */
function PsychologyRunner({ exp, participantName, participantId, onExit, onComplete }) {
  const [questions, setQuestions] = useState([]);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [answers, setAnswers] = useState({});
  const [previewImage, setPreviewImage] = useState(null);
  const [loading, setLoading] = useState(true);
  const [submitting, setSubmitting] = useState(false);
  const startTimeRef = useRef(Date.now());

  useEffect(() => {
    async function load() {
      try {
        const q = await db.fetchPsyQuestions(exp.id);
        const validQuestions = (Array.isArray(q) && q.length > 0)
          ? q
          : PSY_DEFAULT_QUESTIONS.map((item, idx) => ({
              ...item,
              id: `psy-${exp.id}-${idx}`,
              experiment_id: exp.id
            }));
        setQuestions(validQuestions);
      } catch (err) {
        console.error("Error loading psychology questions:", err);
        setQuestions(PSY_DEFAULT_QUESTIONS.map((item, idx) => ({
          ...item,
          id: `psy-${exp.id}-${idx}`,
          experiment_id: exp.id
        })));
      } finally {
        setLoading(false);
        startTimeRef.current = Date.now();
      }
    }
    load();
  }, [exp.id]);

  if (loading) {
    return (
      <div className="w-full h-screen bg-slate-900 flex items-center justify-center text-white">
        <div className="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mr-3" />
        <span className="text-sm font-mono text-slate-300">Loading psychological assessment...</span>
      </div>
    );
  }

  // Guaranteed fallback if questions array is empty
  const activeQuestions = (questions && questions.length > 0)
    ? questions
    : PSY_DEFAULT_QUESTIONS.map((item, idx) => ({
        ...item,
        id: `psy-${exp.id}-${idx}`,
        experiment_id: exp.id
      }));

  const currentQ = activeQuestions[currentIndex] || activeQuestions[0];
  const qId = String(currentQ?.id || `q-${currentIndex}`);

  // Safely extract current answer state
  const rawAnswer = answers ? answers[qId] : null;
  const qState = (rawAnswer && typeof rawAnswer === 'object' && rawAnswer !== null)
    ? {
        selectedOption: typeof rawAnswer.selectedOption === 'number' ? rawAnswer.selectedOption : null,
        customText: typeof rawAnswer.customText === 'string' ? rawAnswer.customText : ''
      }
    : {
        selectedOption: typeof rawAnswer === 'number' ? rawAnswer : null,
        customText: typeof rawAnswer === 'string' ? rawAnswer : ''
      };

  // Safely parse options whether they are an array, JSON string, or need default fallback
  let parsedOptions = currentQ?.options;
  if (typeof parsedOptions === 'string') {
    try {
      parsedOptions = JSON.parse(parsedOptions);
    } catch(e) {
      parsedOptions = null;
    }
  }

  const currentOptions = (Array.isArray(parsedOptions) && parsedOptions.length >= 4)
    ? parsedOptions
    : [
        'Energized and hyper-focused on collective goals',
        'Moderately anxious but capable of prioritizing',
        'Overwhelmed by concurrent communication channels',
        'Emotionally calm and preferring to analyze data individually'
      ];

  const handleSelectOption = (idx) => {
    if (!currentQ) return;
    const targetQId = String(currentQ.id || `q-${currentIndex}`);
    setAnswers(prev => {
      const prevEntry = (prev && typeof prev[targetQId] === 'object' && prev[targetQId] !== null)
        ? prev[targetQId]
        : {};
      return {
        ...(prev || {}),
        [targetQId]: {
          ...prevEntry,
          customText: typeof prevEntry.customText === 'string' ? prevEntry.customText : '',
          selectedOption: idx
        }
      };
    });
  };

  const handleCustomTextChange = (text) => {
    if (!currentQ) return;
    const targetQId = String(currentQ.id || `q-${currentIndex}`);
    setAnswers(prev => {
      const prevEntry = (prev && typeof prev[targetQId] === 'object' && prev[targetQId] !== null)
        ? prev[targetQId]
        : {};
      return {
        ...(prev || {}),
        [targetQId]: {
          ...prevEntry,
          selectedOption: 4, // Auto select Option 5 (Other)
          customText: text
        }
      };
    });
  };

  const canProceed = () => {
    if (qState.selectedOption === null) return false;
    if (qState.selectedOption === 4) {
      return (qState.customText || '').trim().length > 0;
    }
    return true;
  };

  const handleNext = async () => {
    if (currentIndex < activeQuestions.length - 1) {
      setCurrentIndex(i => i + 1);
    } else {
      setSubmitting(true);
      const latency = Date.now() - startTimeRef.current;
      const resultsPayload = activeQuestions.map((q, qIdx) => {
        const itemQId = String(q.id || `q-${qIdx}`);
        const rawItem = answers ? answers[itemQId] : null;
        const itemState = (rawItem && typeof rawItem === 'object' && rawItem !== null)
          ? rawItem
          : {
              selectedOption: typeof rawItem === 'number' ? rawItem : null,
              customText: typeof rawItem === 'string' ? rawItem : ''
            };

        let opts = q.options;
        if (typeof opts === 'string') {
          try { opts = JSON.parse(opts); } catch(e) { opts = null; }
        }
        const safeOpts = (Array.isArray(opts) && opts.length >= 4) ? opts : currentOptions;

        let responseString = '';
        let targetKey = 'Option';

        if (itemState.selectedOption === 4) {
          responseString = `Option 5 (Other): ${(itemState.customText || '').trim() || '(No custom text provided)'}`;
          targetKey = 'Option 5 (Other)';
        } else if (itemState.selectedOption !== null && safeOpts[itemState.selectedOption]) {
          const letter = ['A', 'B', 'C', 'D'][itemState.selectedOption];
          responseString = `Option ${letter}: ${safeOpts[itemState.selectedOption]}`;
          targetKey = `Option ${letter}`;
        } else {
          responseString = '(No response)';
          targetKey = 'N/A';
        }

        return {
          experiment_id: exp.id,
          participant_id: participantId,
          participant_name: participantName,
          stimulus: q.question || 'Psychological Assessment Stimulus',
          font_color: '#8b5cf6',
          reaction_time_ms: Math.max(10, Math.round(latency / Math.max(1, activeQuestions.length))),
          user_response: responseString,
          target_key: targetKey,
          is_correct: true
        };
      });

      await db.bulkInsertResults(resultsPayload);
      setSubmitting(false);
      onComplete();
    }
  };

  const isOption5Selected = qState.selectedOption === 4;

  return (
    <div className="min-h-screen bg-slate-900 text-white flex flex-col justify-between p-6 anim-fade">
      {/* Top Header */}
      <div className="max-w-3xl mx-auto w-full flex items-center justify-between py-4 border-b border-slate-800">
        <div className="flex items-center gap-2">
          <span className="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse" />
          <span className="text-xs font-mono uppercase tracking-wider text-slate-400">{exp.title}</span>
        </div>
        <div className="flex items-center gap-4">
          <span className="text-xs font-mono text-indigo-400">
            Question {currentIndex + 1} of {activeQuestions.length}
          </span>
          <button onClick={onExit} className="text-xs text-slate-500 hover:text-white px-2.5 py-1 rounded bg-slate-800 transition-colors">
            Exit (ESC)
          </button>
        </div>
      </div>

      {/* Main Question Card */}
      <div className="max-w-2xl mx-auto w-full my-auto py-8 anim-up">
        {/* Progress Bar */}
        <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mb-8">
          <div
            className="bg-indigo-500 h-full transition-all duration-300"
            style={{ width: `${((currentIndex + 1) / activeQuestions.length) * 100}%` }}
          />
        </div>

        {/* Local / Web Uploaded Image Display with Hover & Click to Full-Screen Preview */}
        {currentQ?.image_url && (
          <div className="mb-6">
            <div
              onClick={() => setPreviewImage(currentQ.image_url)}
              className="group relative rounded-2xl overflow-hidden border border-slate-700 bg-slate-950 max-h-80 flex items-center justify-center shadow-2xl cursor-zoom-in transition-all duration-300 hover:border-indigo-500/80 hover:shadow-indigo-500/10"
              title="Click image to open in full screen preview"
            >
              <img
                src={currentQ.image_url}
                alt="Stimulus"
                className="w-full h-full object-contain max-h-80 transition-transform duration-500 ease-out group-hover:scale-[1.03]"
              />
              <div className="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center justify-center backdrop-blur-[2px]">
                <div className="px-4 py-2 rounded-full bg-slate-900/95 border border-slate-600/80 text-white text-xs font-bold flex items-center gap-2 shadow-2xl scale-95 group-hover:scale-100 transition-transform duration-200">
                  <Icon n="Maximize" size={14} cls="text-indigo-400" />
                  <span>Click image to expand in big screen</span>
                </div>
              </div>
              <div className="absolute bottom-3 right-3 bg-slate-900/80 backdrop-blur-md border border-slate-700/80 rounded-lg px-2.5 py-1 text-[10px] text-slate-300 flex items-center gap-1.5 shadow pointer-events-none opacity-80 group-hover:opacity-0 transition-opacity">
                <Icon n="Maximize" size={11} cls="text-indigo-400" />
                <span>Click for big screen</span>
              </div>
            </div>
          </div>
        )}

        <h3 className="text-xl md:text-2xl font-bold text-white mb-6 leading-snug">
          {currentQ?.question}
        </h3>

        {/* 5 Options: 4 Researcher Provided + 5th Custom Typed Response */}
        <div className="space-y-3 mb-8">
          <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
            <span>Select an option or type your own:</span>
            <span className="text-[10px] text-indigo-400 font-mono">5 Options Available</span>
          </label>

          {/* 4 Options from Researcher */}
          {currentOptions.slice(0, 4).map((optText, idx) => {
            const letter = ['A', 'B', 'C', 'D'][idx];
            const isSelected = qState.selectedOption === idx;
            return (
              <div
                key={idx}
                onClick={() => handleSelectOption(idx)}
                className={`cursor-pointer p-4 rounded-2xl border-2 transition-all flex items-center gap-3.5 group select-none ${
                  isSelected
                    ? 'border-indigo-500 bg-indigo-950/40 text-white shadow-lg shadow-indigo-950/50'
                    : 'border-slate-800 bg-slate-800/60 hover:border-slate-700 hover:bg-slate-800/90 text-slate-200'
                }`}
              >
                <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs shrink-0 transition-all ${
                  isSelected
                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/30'
                    : 'bg-slate-700/80 group-hover:bg-slate-600 text-slate-300'
                }`}>
                  {letter}
                </div>
                <div className="flex-1 text-sm font-medium leading-relaxed">
                  {optText}
                </div>
                <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 transition-all ${
                  isSelected ? 'border-indigo-400 bg-indigo-600' : 'border-slate-600 group-hover:border-slate-500'
                }`}>
                  {isSelected && <span className="w-2 h-2 rounded-full bg-white" />}
                </div>
              </div>
            );
          })}

          {/* 5th Option: Participant Custom Typed Response */}
          <div
            onClick={() => handleSelectOption(4)}
            className={`cursor-pointer p-4 rounded-2xl border-2 transition-all space-y-3 group ${
              isOption5Selected
                ? 'border-indigo-500 bg-indigo-950/40 text-white shadow-lg shadow-indigo-950/50'
                : 'border-slate-800 bg-slate-800/60 hover:border-slate-700 hover:bg-slate-800/90 text-slate-200'
            }`}
          >
            <div className="flex items-center gap-3.5 select-none">
              <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs shrink-0 transition-all ${
                isOption5Selected
                  ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/30'
                  : 'bg-slate-700/80 group-hover:bg-slate-600 text-slate-300'
              }`}>
                E
              </div>
              <div className="flex-1 text-sm font-semibold text-indigo-300">
                Option 5: Other (Type your own answer / reflection)
              </div>
              <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 transition-all ${
                isOption5Selected ? 'border-indigo-400 bg-indigo-600' : 'border-slate-600 group-hover:border-slate-500'
              }`}>
                {isOption5Selected && <span className="w-2 h-2 rounded-full bg-white" />}
              </div>
            </div>

            <div className="pt-1">
              <textarea
                value={qState.customText || ''}
                onClick={(e) => e.stopPropagation()}
                onFocus={() => handleSelectOption(4)}
                onChange={(e) => handleCustomTextChange(e.target.value)}
                rows={3}
                placeholder="Type your own answer, thoughts, or custom reflections here..."
                className={`w-full p-3.5 rounded-xl bg-slate-900 border text-white placeholder-slate-500 text-sm outline-none resize-none transition-all leading-relaxed ${
                  isOption5Selected
                    ? 'border-indigo-500/80 focus:ring-2 focus:ring-indigo-500/30 ring-1 ring-indigo-500/20'
                    : 'border-slate-700 focus:border-slate-500'
                }`}
              />
              <div className="flex items-center justify-between px-1 pt-1.5 text-[11px] text-slate-400">
                <span>
                  {isOption5Selected ? '✍️ Custom answer mode active' : 'Click box or Option E to type custom response'}
                </span>
                <span className="font-mono">{(qState.customText || '').length} characters</span>
              </div>
            </div>
          </div>
        </div>

        {/* Navigation */}
        <div className="flex items-center justify-between pt-2">
          <button
            onClick={() => setCurrentIndex(i => Math.max(0, i - 1))}
            disabled={currentIndex === 0}
            className="text-xs font-semibold text-slate-400 hover:text-white disabled:opacity-30 py-2.5 px-4 rounded-xl hover:bg-slate-800 transition-colors"
          >
            ← Previous Question
          </button>

          <button
            onClick={handleNext}
            disabled={!canProceed() || submitting}
            className="btn-brand text-xs font-bold px-8 py-3 rounded-xl disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2 shadow-lg shadow-indigo-600/25"
          >
            {currentIndex === activeQuestions.length - 1
              ? (submitting ? 'Submitting Responses...' : 'Finish & Submit Assessment ✓')
              : 'Next Question →'}
          </button>
        </div>
      </div>

      <div className="max-w-3xl mx-auto w-full text-center text-[11px] text-slate-500 py-3">
        Participant: {participantName} · All responses recorded
      </div>

      {/* Big Screen Image Preview Modal */}
      {previewImage && (
        <ImagePreviewModal
          src={previewImage}
          alt={currentQ?.question || "Stimulus preview"}
          onClose={() => setPreviewImage(null)}
        />
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────────
   EXPERIMENT PARTICIPANT ONBOARDING MODAL
───────────────────────────────────────────────────────────────────────────── */
function ParticipantFlowModal({ exp, defaultName, onClose, onLaunch }) {
  const [step, setStep] = useState('consent');
  const [name, setName] = useState(defaultName || '');
  const [age, setAge] = useState('');
  const [gender, setGender] = useState('');
  const [edu, setEdu] = useState('');
  const [hasCond, setHasCond] = useState(false);
  const [neuro, setNeuro] = useState('');
  const [agreed, setAgreed] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [participantId, setParticipantId] = useState(null);

  // Strict Age Validation: Must be a valid number and >= 18
  const parsedAge = parseInt(age, 10);
  const isAgeEntered = age.trim() !== '' && !isNaN(parsedAge);
  const isAgeValid = isAgeEntered && parsedAge >= 18;
  const isUnderage = isAgeEntered && parsedAge < 18;

  const readyForRules = agreed && !isUnderage && name.trim().length > 0 && isAgeValid && gender && edu && !submitting;

  const handleConsentProceed = async () => {
    if (!readyForRules || !isAgeValid) return;
    try {
      setSubmitting(true);
      const participant = await db.insertParticipant({
        name: name.trim(),
        age: parsedAge,
        gender,
        education: edu,
        has_condition: hasCond,
        neuro_conditions: neuro
      });

      setParticipantId(participant.id);
      setStep('rules');
    } catch (err) {
      console.error('Consent error:', err);
    } finally {
      setSubmitting(false);
    }
  };

  const sel = "w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 bg-white focus:border-indigo-500";
  const inp = "w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 bg-white focus:border-indigo-500";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm anim-fade">
      <div className="w-full max-w-xl bg-white rounded-3xl shadow-2xl overflow-hidden anim-up">
        {/* Header */}
        <div className="relative overflow-hidden bg-gradient-to-br from-indigo-600 to-violet-700 px-7 py-5 text-white">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[11px] font-bold tracking-wider uppercase text-indigo-200 bg-white/10 px-2.5 py-0.5 rounded-full">
              {step === 'consent' ? 'Step 1 of 2: Pre-Screening' : 'Step 2 of 2: Custom Rules & Instructions'}
            </span>
            <button onClick={onClose} className="w-7 h-7 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center text-white transition-colors">✕</button>
          </div>
          <h2 className="text-xl font-bold">
            {step === 'consent' ? 'Research Consent & Participant Profile' : 'Protocol Instructions'}
          </h2>
          <p className="text-indigo-100 text-xs mt-0.5">{exp.title}</p>
        </div>

        {step === 'consent' ? (
          <div className="px-7 py-5 space-y-4 max-h-[62vh] overflow-y-auto">
            <div>
              <label className="text-xs font-semibold text-slate-600 block mb-1">
                Participant Full Name * <span className="text-slate-400 font-normal">(Recorded for cohort statistics)</span>
              </label>
              <input
                type="text"
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="e.g. Sarah Jenkins"
                className={inp}
              />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs font-semibold text-slate-600 block mb-1">
                  Age * <span className="text-slate-400 font-normal">(Must be 18+)</span>
                </label>
                <input
                  type="number"
                  min="18"
                  max="120"
                  value={age}
                  onChange={e => setAge(e.target.value)}
                  placeholder="e.g. 24"
                  className={`${inp} ${isUnderage ? 'border-rose-400 focus:border-rose-500 bg-rose-50/30 text-rose-900' : ''}`}
                />
                {isUnderage && (
                  <div className="mt-1.5 p-2 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-[11px] font-semibold flex items-center gap-1.5 anim-fade">
                    <span>⚠️</span>
                    <span>Participants under 18 cannot take this test per IRB consent requirements.</span>
                  </div>
                )}
              </div>
              <div>
                <label className="text-xs font-semibold text-slate-600 block mb-1">Gender *</label>
                <select value={gender} onChange={e=>setGender(e.target.value)} className={sel}>
                  <option value="">Select…</option>
                  <option>Male</option><option>Female</option><option>Non-binary</option><option>Prefer not to say</option>
                </select>
              </div>
              <div className="col-span-2">
                <label className="text-xs font-semibold text-slate-600 block mb-1">Highest Qualification *</label>
                <select value={edu} onChange={e=>setEdu(e.target.value)} className={sel}>
                  <option value="">Select…</option>
                  <option>High School / GED</option><option>Some College</option>
                  <option>Bachelor's Degree</option><option>Master's Degree</option><option>Doctoral Degree</option>
                </select>
              </div>
            </div>

            <div>
              <label className="flex items-start gap-3 cursor-pointer">
                <input
                  type="checkbox"
                  checked={hasCond}
                  onChange={e=>setHasCond(e.target.checked)}
                  className="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                />
                <span className="text-xs text-slate-700 leading-snug">
                  Prior or current neurological / mental health condition? <span className="text-slate-400">(Required for baseline research accuracy, anonymized).</span>
                </span>
              </label>
              {hasCond && (
                <textarea
                  value={neuro}
                  onChange={e=>setNeuro(e.target.value)}
                  rows={2}
                  placeholder="Describe condition (e.g., ADHD, anxiety)..."
                  className={`${inp} resize-none text-xs mt-2`}
                />
              )}
            </div>

            <label className={`flex items-start gap-3 p-3 rounded-xl border transition-colors ${
              isUnderage
                ? 'border-rose-200 bg-rose-50/30 opacity-60 cursor-not-allowed'
                : 'border-slate-200 hover:bg-slate-50 cursor-pointer'
            }`}>
              <input
                type="checkbox"
                checked={agreed && !isUnderage}
                disabled={isUnderage}
                onChange={e => {
                  if (!isUnderage) setAgreed(e.target.checked);
                }}
                className="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 disabled:cursor-not-allowed"
              />
              <span className="text-xs text-slate-600 leading-relaxed">
                I agree to participate voluntarily and confirm I am <strong>18 years of age or older</strong>.
              </span>
            </label>

            <div className="pt-2 flex items-center justify-between border-t border-slate-100">
              <button onClick={onClose} className="text-xs font-semibold text-slate-400 hover:text-slate-600">Cancel</button>
              <button
                onClick={handleConsentProceed}
                disabled={!readyForRules}
                className="btn-brand text-xs px-6 py-2.5 rounded-xl flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed"
              >
                {submitting ? 'Recording Profile...' : isUnderage ? 'Age 18+ Required' : <>Proceed to Rules <Icon n="ChevRight" size={13} /></>}
              </button>
            </div>
          </div>
        ) : (
          /* STEP 2: Custom Rules & Time Limit Display (Clean Psychology vs Cognitive Rules) */
          <div className="px-7 py-6 space-y-5 overflow-y-auto anim-fade" style={{ maxHeight: '64vh' }}>
            {exp.type === 'cognitive' && exp.time_limit_seconds > 0 && (
              <div className="p-4 bg-indigo-50 border border-indigo-200 rounded-2xl flex items-center justify-between">
                <div>
                  <span className="text-[10px] uppercase font-bold text-indigo-700 tracking-wider">Test Duration</span>
                  <p className="text-sm font-bold text-indigo-900 mt-0.5">{exp.time_limit_seconds} Seconds Active Time Limit</p>
                </div>
                <div className="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-mono font-bold text-sm">
                  {exp.time_limit_seconds}s
                </div>
              </div>
            )}

            {exp.type === 'psychology' && (
              <div className="p-4 bg-violet-50 border border-violet-200 rounded-2xl flex items-center justify-between">
                <div>
                  <span className="text-[10px] uppercase font-bold text-violet-700 tracking-wider">Assessment Format</span>
                  <p className="text-sm font-bold text-violet-900 mt-0.5">Untimed Self-Paced Psychological Questionnaire</p>
                </div>
                <div className="px-3.5 py-1.5 rounded-full bg-violet-600 text-white font-bold text-xs shadow-sm">
                  Self-Paced
                </div>
              </div>
            )}

            <div>
              <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Researcher's Protocol Rules</h4>
              <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-slate-800 text-xs leading-relaxed whitespace-pre-line font-medium">
                {(() => {
                  if (exp.type === 'psychology') {
                    const isCognitiveRule = exp.rules && (
                      exp.rules.toLowerCase().includes('fixation cross') ||
                      exp.rules.toLowerCase().includes('ink color') ||
                      exp.rules.toLowerCase().includes('font color') ||
                      exp.rules.toLowerCase().includes('[f]') ||
                      exp.rules.toLowerCase().includes('[j]') ||
                      exp.rules.toLowerCase().includes('stroop')
                    );
                    if (!exp.rules || isCognitiveRule) {
                      return '1. Review each visual stimulus image and question prompt carefully.\n2. You can click on any stimulus image to open a full-screen preview.\n3. Choose from the 4 provided options, or choose Option 5 to type your own reflection.\n4. Take as much time as you need—there is no countdown pressure.';
                    }
                    return exp.rules;
                  }
                  return exp.rules || '1. Focus on the central fixation cross (+) for 500ms.\n2. Identify the INK COLOR of the word, not the written word.\n3. Press [F] for left key, [J] for right key.\n4. Respond as rapidly as possible before the timer runs out.';
                })()}
              </div>
            </div>

            {exp.type === 'cognitive' && (
              <div className="bg-slate-900 text-white rounded-2xl p-4 text-center">
                <p className="text-[10px] uppercase font-bold text-slate-400 mb-2">Keyboard Key Mapping</p>
                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div className="bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                    <span className="font-mono text-base font-bold bg-slate-700 px-2.5 py-0.5 rounded mr-2">F</span>
                    <span className="text-slate-300">Left Key</span>
                  </div>
                  <div className="bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                    <span className="font-mono text-base font-bold bg-slate-700 px-2.5 py-0.5 rounded mr-2">J</span>
                    <span className="text-slate-300">Right Key</span>
                  </div>
                </div>
              </div>
            )}

            {exp.type === 'psychology' && (
              <div className="bg-slate-900 text-white rounded-2xl p-4">
                <p className="text-[10px] uppercase font-bold text-slate-400 mb-2">Response System</p>
                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div className="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-[11px] text-white">4</span>
                    <span className="text-slate-300">Researcher Options (A-D)</span>
                  </div>
                  <div className="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-violet-600 flex items-center justify-center font-bold text-[11px] text-white">5</span>
                    <span className="text-slate-300">Option E: Custom Typed</span>
                  </div>
                </div>
              </div>
            )}

            <div className="pt-2 flex items-center justify-between border-t border-slate-100">
              <button onClick={() => setStep('consent')} className="text-xs font-semibold text-slate-400 hover:text-slate-600">
                ← Edit Profile
              </button>
              <button
                onClick={() => onLaunch(participantId, name.trim())}
                className="btn-brand text-xs font-bold px-7 py-3 rounded-xl flex items-center gap-2 shadow-lg"
              >
                <Icon n="Play" size={13} />
                I Understand the Rules — Begin Task
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const DEFAULT_COGNITIVE_RULES = '1. Focus on the central fixation cross (+) for 500ms.\n2. Identify the INK COLOR of the word, not the written word.\n3. Press [F] for left key, [J] for right key.\n4. Respond as rapidly as possible before the timer runs out.';

const DEFAULT_PSYCHOLOGY_RULES = '1. Review each visual stimulus image and question prompt carefully.\n2. You can click on any stimulus image to expand it in full screen.\n3. Choose from 4 researcher options or type any custom answer in Option 5.\n4. Take as much time as you need—there is no countdown pressure.';

/* ─────────────────────────────────────────────────────────────────────────────
   RESEARCHER PROTOCOL BUILDER (Requirement 3: Cleaned Question & Local Image)
───────────────────────────────────────────────────────────────────────────── */
function ExperimentBuilder({ onDeploySuccess, onBack }) {
  const [testType, setTestType] = useState('cognitive');
  const [title, setTitle] = useState('');
  const [desc, setDesc] = useState('');
  const [timeLimit, setTimeLimit] = useState(20);
  const [customRules, setCustomRules] = useState(DEFAULT_COGNITIVE_RULES);

  const handleSwitchTestType = (newType) => {
    setTestType(newType);
    if (newType === 'psychology') {
      const isCognitiveRule = !customRules.trim() ||
        customRules === DEFAULT_COGNITIVE_RULES ||
        customRules.includes('fixation cross') ||
        customRules.includes('INK COLOR') ||
        customRules.includes('ink color') ||
        customRules.includes('[F]') ||
        customRules.includes('[J]');
      if (isCognitiveRule) {
        setCustomRules(DEFAULT_PSYCHOLOGY_RULES);
      }
    } else {
      const isPsychologyRule = !customRules.trim() ||
        customRules === DEFAULT_PSYCHOLOGY_RULES ||
        customRules.includes('stimulus image') ||
        customRules.includes('Option 5') ||
        customRules.includes('countdown pressure');
      if (isPsychologyRule) {
        setCustomRules(DEFAULT_COGNITIVE_RULES);
      }
    }
  };

  // Cognitive trials with Ink Color
  const [trials, setTrials] = useState([
    { id: 1, stimulus: 'RED', font_color: '#3b82f6', targetKey: 'j' },
    { id: 2, stimulus: 'BLUE', font_color: '#ef4444', targetKey: 'f' },
    { id: 3, stimulus: 'GREEN', font_color: '#eab308', targetKey: 'j' },
    { id: 4, stimulus: 'YELLOW', font_color: '#10b981', targetKey: 'f' }
  ]);

  // Requirement: Psychology questions with question bar, local image upload & 4 researcher options
  const [questions, setQuestions] = useState([
    {
      id: 1,
      question: 'How does this collaborative scenario affect your psychological state and focus?',
      image_url: '',
      options: [
        'Energized and hyper-focused on solving the problem together',
        'Moderately anxious but capable of maintaining task structure',
        'Overwhelmed by multiple parallel discussions and noise',
        'Emotionally calm and preferring to analyze data individually'
      ]
    }
  ]);
  const [previewImage, setPreviewImage] = useState(null);

  const [deploying, setDeploying] = useState(false);

  const COLOR_PALETTE = [
    { label: 'Red', hex: '#ef4444' },
    { label: 'Blue', hex: '#3b82f6' },
    { label: 'Green', hex: '#10b981' },
    { label: 'Yellow', hex: '#eab308' },
    { label: 'Purple', hex: '#a855f7' },
    { label: 'White', hex: '#ffffff' }
  ];

  const handleLocalImageUpload = (qId, file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const base64Data = e.target.result;
      setQuestions(prev => prev.map(q => q.id === qId ? { ...q, image_url: base64Data } : q));
    };
    reader.readAsDataURL(file);
  };

  const handleDeploy = async () => {
    if (!title.trim()) return;
    setDeploying(true);

    let finalRules = customRules.trim();
    if (!finalRules) {
      finalRules = testType === 'psychology' ? DEFAULT_PSYCHOLOGY_RULES : DEFAULT_COGNITIVE_RULES;
    }

    const newExp = await db.insertExperiment({
      type: testType,
      title: title.trim(),
      description: desc.trim(),
      rules: finalRules,
      time_limit_seconds: testType === 'cognitive' ? parseInt(timeLimit) : 0,
      status: 'live'
    });

    if (testType === 'cognitive') {
      const trialsPayload = trials.map((t, idx) => ({
        experiment_id: newExp.id,
        stimulus: t.stimulus.trim(),
        font_color: t.font_color || '#ffffff',
        target_key: t.targetKey.trim() || 'f',
        order_index: idx
      }));
      await db.bulkInsertTrials(trialsPayload);
    } else {
      const qPayload = questions.map((q, idx) => ({
        experiment_id: newExp.id,
        question: q.question.trim(),
        image_url: q.image_url || '',
        options: (q.options && Array.isArray(q.options) && q.options.length >= 4) ? q.options : [
          'Option A description',
          'Option B description',
          'Option C description',
          'Option D description'
        ],
        order_index: idx
      }));
      await db.bulkInsertPsyQuestions(qPayload);
    }

    setDeploying(false);
    onDeploySuccess(newExp);
  };

  const inp = "w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 bg-white";

  return (
    <div className="anim-up max-w-3xl mx-auto space-y-6">
      <div className="flex items-center gap-3">
        <button onClick={onBack} className="w-9 h-9 flex items-center justify-center rounded-xl border border-slate-200 text-slate-500 hover:bg-indigo-50">
          <Icon n="ArrowLeft" size={16} />
        </button>
        <div>
          <h2 className="text-xl font-bold text-slate-900">Create New Protocol</h2>
          <p className="text-xs text-slate-500">Configure paradigm type, time limits, and stimuli</p>
        </div>
      </div>

      {/* Select Test Type */}
      <div className="grid grid-cols-2 gap-4">
        <div
          onClick={() => handleSwitchTestType('cognitive')}
          className={`cursor-pointer p-5 rounded-2xl border-2 transition-all ${
            testType === 'cognitive'
              ? 'border-indigo-600 bg-indigo-50/50 shadow-md shadow-indigo-100'
              : 'border-slate-200 bg-white hover:border-slate-300'
          }`}
        >
          <div className="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center mb-3 shadow">
            <Icon n="Brain" size={20} />
          </div>
          <h3 className="font-bold text-slate-900 text-sm">Cognitive Science Test</h3>
          <p className="text-xs text-slate-500 mt-1 leading-relaxed">
            Timed reaction tests with millisecond latency, randomized word streams, and custom font ink colors.
          </p>
        </div>

        <div
          onClick={() => handleSwitchTestType('psychology')}
          className={`cursor-pointer p-5 rounded-2xl border-2 transition-all ${
            testType === 'psychology'
              ? 'border-indigo-600 bg-indigo-50/50 shadow-md shadow-indigo-100'
              : 'border-slate-200 bg-white hover:border-slate-300'
          }`}
        >
          <div className="w-10 h-10 rounded-xl bg-violet-600 text-white flex items-center justify-center mb-3 shadow">
            <Icon n="Clipboard" size={20} />
          </div>
          <h3 className="font-bold text-slate-900 text-sm">Psychology Assessment</h3>
          <p className="text-xs text-slate-500 mt-1 leading-relaxed">
            Open-ended questionnaire and visual reflection assessment with direct local computer image uploads.
          </p>
        </div>
      </div>

      {/* Protocol Details */}
      <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
        <h4 className="font-semibold text-slate-800 text-sm">Protocol Details</h4>
        <div>
          <label className="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Title *</label>
          <input
            value={title}
            onChange={e=>setTitle(e.target.value)}
            placeholder={testType === 'cognitive' ? 'e.g. Rapid Stroop Color-Word Test' : 'e.g. Visual Affective Reflection Scale'}
            className={inp}
          />
        </div>
        <div>
          <label className="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Description</label>
          <textarea
            value={desc}
            onChange={e=>setDesc(e.target.value)}
            rows={2}
            placeholder="Describe the research hypothesis..."
            className={`${inp} resize-none`}
          />
        </div>

        {/* TIME LIMIT OPTION FOR COGNITIVE TEST */}
        {testType === 'cognitive' && (
          <div className="pt-2 p-4 bg-indigo-50/60 border border-indigo-100 rounded-2xl">
            <label className="block text-xs font-bold text-indigo-900 uppercase tracking-wider mb-2 flex items-center gap-1.5">
              <Icon n="Clock" size={14} cls="text-indigo-600" /> Task Time Limit (Seconds)
            </label>
            <p className="text-xs text-slate-500 mb-3">
              Words will appear in randomized sequence continuously until the countdown timer expires.
            </p>
            <div className="flex flex-wrap gap-2">
              {[10, 15, 20, 25, 30, 45, 60].map((sec) => (
                <button
                  key={sec}
                  type="button"
                  onClick={() => setTimeLimit(sec)}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                    timeLimit === sec
                      ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200'
                      : 'bg-white border border-slate-200 text-slate-700 hover:border-indigo-400'
                  }`}
                >
                  {sec}s
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Custom Rules */}
        <div className="pt-2">
          <div className="flex items-center justify-between mb-1.5">
            <label className="text-[11px] font-semibold text-indigo-700 uppercase tracking-wider">
              {testType === 'psychology' ? 'Psychology Participant Rules & Instructions' : 'Cognitive Protocol Rules & Instructions'}
            </label>
            <button
              type="button"
              onClick={() => setCustomRules(testType === 'psychology' ? DEFAULT_PSYCHOLOGY_RULES : DEFAULT_COGNITIVE_RULES)}
              className="text-[10px] text-slate-400 hover:text-indigo-600 underline font-medium"
            >
              Reset to {testType === 'psychology' ? 'Psychology' : 'Cognitive'} defaults
            </button>
          </div>
          <textarea
            value={customRules}
            onChange={e=>setCustomRules(e.target.value)}
            rows={3}
            className={`${inp} resize-none font-mono text-xs`}
          />
        </div>
      </div>

      {/* COGNITIVE TEST BUILDER */}
      {testType === 'cognitive' && (
        <div className="bg-white rounded-2xl border border-slate-200 p-6">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h4 className="font-semibold text-slate-800 text-sm flex items-center gap-1.5">
                <Icon n="Brain" size={15} cls="text-indigo-600" /> Trial Stimuli & Ink Colors
              </h4>
              <p className="text-xs text-slate-400 mt-0.5">
                Select word text and ink font color (e.g. Word "RED" in Blue font)
              </p>
            </div>
            <button
              onClick={() => setTrials(p => [...p, { id: Date.now(), stimulus: '', font_color: '#ef4444', targetKey: 'f' }])}
              className="btn-brand text-xs px-3.5 py-1.5 rounded-lg flex items-center gap-1"
            >
              + Add Trial
            </button>
          </div>

          <div className="space-y-3">
            {trials.map((trial, idx) => (
              <div key={trial.id} className="p-3.5 rounded-xl border border-slate-200 bg-slate-50 flex items-center gap-3">
                <span className="text-xs font-mono font-bold text-slate-400 w-5">{idx + 1}</span>

                <div className="flex-1">
                  <label className="block text-[10px] text-slate-400 font-semibold mb-1 uppercase">Stimulus Word</label>
                  <input

                    onChange={(e) => {

                      setTrials(p => p.map(t => t.id === trial.id ? { ...t, stimulus: v } : t));
